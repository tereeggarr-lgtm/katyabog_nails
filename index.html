<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маникюр • Петропавловск | @katyabog_nails</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1414;
            color: #f3e9e9;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        header p {
            font-size: 14px;
            color: #d1c2c2;
            margin-bottom: 6px;
        }

        header a {
            font-size: 15px;
            color: #f3e9e9;
            text-decoration: underline;
            font-weight: 500;
        }

        h2.section-title {
            font-size: 18px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Карточки услуг */
        .card {
            background-color: #261d1d;
            border: 1px solid #3d2e2e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .card:hover {
            border-color: #8c5858;
        }

        /* Выделенная бордовая кнопка Наращивание сверху */
        .card.highlighted-box {
            background-color: #6b2d38;
            border: 1px solid #8c3b49;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-title-text {
            flex: 1;
        }

        .card-price-text {
            white-space: nowrap;
        }

        .card-desc {
            font-size: 13px;
            color: #b5a4a4;
            line-height: 1.4;
            margin-top: 6px;
        }

        .card-desc strong {
            color: #f3e9e9;
            font-weight: 600;
        }

        /* Активная (выбранная) карточка */
        .card.active {
            border-color: #a34848;
            background-color: #332323;
        }

        .sub-section {
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        /* Блок счетчика */
        .counter-box {
            background-color: #261d1d;
            border: 1px solid #3d2e2e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 12px 0 8px 0;
        }

        .counter-btn {
            background-color: #3d2e2e;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .counter-btn:active {
            background-color: #594242;
        }

        .counter-value {
            font-size: 18px;
            font-weight: bold;
        }

        /* Итог (Ваш визит) */
        .summary-box {
            background-color: #261d1d;
            border: 1px solid #4a3636;
            border-radius: 14px;
            padding: 16px;
            margin-top: 24px;
            margin-bottom: 20px;
        }

        .summary-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #d1c2c2;
            gap: 10px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #3d2e2e;
            color: #ffffff;
        }

        .summary-note {
            text-align: center;
            font-size: 12px;
            color: #b5a4a4;
            margin-top: 16px;
            line-height: 1.4;
        }

        /* Кнопки записи */
        .btn-whatsapp {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: #111;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }

        .btn-whatsapp:active {
            opacity: 0.8;
        }

        .btn-dikidi {
            display: block;
            width: 100%;
            background-color: #6b2d2d;
            color: #ffffff;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-dikidi:active {
            background-color: #823838;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Маникюр • Петропавловск</h1>
            <p>Качественное покрытие и эстетика</p>
            <a href="https://instagram.com/katyabog_nails" target="_blank">Instagram: @katyabog_nails</a>
        </header>

        <h2 class="section-title">Выберите услугу</h2>

        <!-- Услуга 1 -->

            <div class="card-header">
                <span class="card-title-text">Маникюр / гигиена</span>
                <span class="card-price-text">— 4 000 ₸</span>
            </div>
            <div class="card-desc">• Аппаратный / комби-маникюр • Опил • Снятие любого покрытия • Уход маслом •
